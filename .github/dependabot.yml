---
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    open-pull-requests-limit: 2
    # .yarnrc.yml refuses npm releases younger than 3 days (npmMinimalAgeGate),
    # so Dependabot must not propose them; one extra day avoids the boundary.
    cooldown:
      default-days: 4
      semver-major-days: 30
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - '*'
      all-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: uv
    directory: '/'
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 30
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      all-version-updates:
        patterns:
          - '*'
      all-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
