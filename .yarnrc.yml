nodeLinker: node-modules
enableScripts: false
patchFolder: experiments/node-library/patches
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@companion-module/*'
  - node-appletv-remote@0.4.0
# The bundled library build (energee a189ea6) imports plist, which npm 0.4.0's manifest lacks.
packageExtensions:
  node-appletv-remote@0.4.0:
    dependencies:
      plist: ^3.1.0
